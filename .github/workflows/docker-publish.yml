name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install and test
        env:
          PYTHON_BIN: /usr/bin/python3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil
          npm ci
          node scripts/license-report.mjs --check
          npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image for verification
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: easy-score:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify container runtime
        env:
          EASY_SCORE_SMOKE_PDF: ${{ runner.temp }}/audiveris-reference.pdf
        run: |
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/Audiveris/audiveris/9e1e55cd2746037d059345881c53e6a6754bffbd/data/examples/Dichterliebe01.pdf \
            -o "$EASY_SCORE_SMOKE_PDF"
          echo "4169e43dda320cb1dc23e79ffd861ee2b78bffd84dd24997ab964d574aa8723f  $EASY_SCORE_SMOKE_PDF" | sha256sum --check --strict
          node docker/smoke.mjs easy-score:ci

      - name: Check Docker Hub publishing credentials
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::Configure repository variable DOCKERHUB_USERNAME and repository secret DOCKERHUB_TOKEN (Docker Hub access token with write permission).'
            exit 1
          fi
          if [[ ! "$DOCKERHUB_USERNAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo '::error::DOCKERHUB_USERNAME must be a Docker Hub namespace, without a URL or image name.'
            exit 1
          fi

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        if: github.event_name != 'pull_request'
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}/easy-score
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Publish verified image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          while IFS= read -r image_tag; do
            docker tag easy-score:ci "$image_tag"
            docker push "$image_tag"
          done <<< "$IMAGE_TAGS"
          {
            echo '### Published Docker Hub images'
            echo '```'
            echo "$IMAGE_TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
